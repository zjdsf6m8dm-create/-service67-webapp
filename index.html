<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SERVICE67</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #080808;
      color: white;
    }

    .app {
      max-width: 600px;
      margin: auto;
      padding: 25px 18px 100px;
    }

    .header {
      text-align: center;
      padding: 30px 10px;
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: auto;
      border-radius: 50%;
      background: #111;
      border: 3px solid #00e5ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
      box-shadow: 0 0 25px #00e5ff55;
    }

    h1 {
      margin: 15px 0 5px;
      font-size: 30px;
    }

    .online {
      color: #00ff88;
      font-size: 14px;
    }

    .welcome {
      margin-top: 25px;
      padding: 25px;
      border-radius: 22px;
      background: #151515;
      border: 1px solid #292929;
    }

    .welcome h2 {
      margin-top: 0;
    }

    .welcome p {
      color: #aaa;
      line-height: 1.5;
    }

    .button {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 17px;
      margin-top: 20px;
      background: #00e5ff;
      color: #001014;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #101010;
      border-top: 1px solid #222;
      display: flex;
      justify-content: space-around;
      padding: 13px 5px 22px;
    }

    .nav {
      color: #888;
      font-size: 13px;
      text-align: center;
    }

    .nav.active {
      color: #00e5ff;
    }

    .icon {
      display: block;
      font-size: 22px;
      margin-bottom: 4px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <div class="logo">67</div>

      <h1>SERVICE67</h1>

      <div class="online">
        ● Boutique en ligne
      </div>
    </div>

    <div class="welcome">
      <h2>Bienvenue 👋</h2>

      <p>
        Bienvenue sur SERVICE67.
        Découvrez notre catalogue directement depuis Telegram.
      </p>

      <button class="button" onclick="ouvrirCatalogue()">
        Voir le catalogue
      </button>
    </div>

  </div>

  <div class="bottom">
    <div class="nav active">
      <span class="icon">🏠</span>
      Accueil
    </div>

    <div class="nav">
      <span class="icon">▦</span>
      Catégories
    </div>

    <div class="nav">
      <span class="icon">🛒</span>
      Panier
    </div>

    <div class="nav">
      <span class="icon">💬</span>
      Contact
    </div>

    <div class="nav">
      <span class="icon">👤</span>
      Profil
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    function ouvrirCatalogue() {
      alert("La boutique SERVICE67 fonctionne !");
    }
  </script>

</body>
</html>
