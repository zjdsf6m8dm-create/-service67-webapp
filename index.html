<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SERVICE67SHOPP</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #080808;
      color: white;
      padding-bottom: 90px;
    }

    header {
      text-align: center;
      padding: 45px 20px 25px;
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: auto;
      border: 3px solid #55eaff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 0 25px #55eaff;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 32px;
    }

    .online {
      color: #55ff75;
      font-weight: bold;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: #171717;
      border: 1px solid #444;
      border-radius: 25px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 28px;
      margin-top: 0;
    }

    .button {
      display: block;
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 18px;
      margin-top: 20px;
      background: #67e8f9;
      color: #06242a;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #171717;
      border-top: 1px solid #333;
      display: flex;
      justify-content: space-around;
      padding: 12px 4px 18px;
    }

    nav button {
      background: none;
      border: none;
      color: white;
      font-size: 13px;
    }

    nav button:first-child {
      color: #55eaff;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">67</div>
  <h1>SERVICE67SHOPP</h1>
  <div class="online">● Boutique en ligne</div>
</header>

<div class="container">
  <div class="card">
    <h2>Bienvenue 👋</h2>
    <p>
      Bienvenue sur SERVICE67SHOPP.
      Découvrez notre catalogue et nos nouveautés.
    </p>

    <button class="button" onclick="alert('Catalogue SERVICE67SHOPP bientôt disponible !')">
      Voir le catalogue
    </button>
  </div>
</div>
  <div class="card">
  <h2>Catalogue</h2>
  <p>1 TAZ — 10 €</p>
  <p>3 TAZ — 20 €</p>
  <p>5 TAZ — 30 €</p>
  <p>7 TAZ — 50 €</p>
  <p>15 TAZ — 100 €</p>
</div>

<nav>
  <button>🏠<br>Accueil</button>
  <button>▦<br>Catégories</button>
  <button>🛒<br>Panier</button>
  <button>💬<br>Contact</button>
  <button>👤<br>Profil</button>
</nav>

</body>
</html>
